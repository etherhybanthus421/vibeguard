name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install (zero deps, but honor lockfile if present)
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Dogfood — vibeguard scans itself
        run: node bin/vibeguard.mjs scan . --quiet

  package:
    name: Package sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the package contents
        run: |
          npm pack --dry-run
          node -e "const p=require('./package.json'); if(!p.bin.vibeguard) process.exit(1); console.log('bin ok')"
